version: '3.9'

networks:
  railway:
    driver: bridge

services:
  db:
    image: postgres:15
    env_file: .env
    container_name: rail_db
    ports:
      - "5432:5432"
    networks:
      - railway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_insert.sql:/docker-entrypoint-initdb.d/02_insert.sql:ro
      - ./db/03_logs.sql:/docker-entrypoint-initdb.d/03_logs.sql:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql

  admin:
      build: ./admin_panel
      container_name: rail_admin
      env_file: .env
      networks:
        - railway
      ports:
        - "8001:8000"
      depends_on:
        db:
          condition: service_healthy
      restart: unless-stopped

  app:
    build: ./app
    env_file: .env
    container_name: rail_app
    ports:
      - "8000:8000"
    networks:
      - railway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    tmpfs:
      - /tmp

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: rail_gitlab
    hostname: 'localhost'
    ports:
      - "8081:8081"
      - "8443:443"
      - "2222:22"
    networks:
      - railway
    restart: unless-stopped
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url "http://${GITLAB_DOMAIN:-gitlab.example.com}"
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        # Отключаем ненужные функции для простого развертывания
        gitlab_rails['gitlab_default_theme'] = 2
        # Уменьшаем использование ресурсов
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 5
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: '256m'
  
  nginx:
    image: nginx:1.27-alpine
    container_name: rail_nginx
    depends_on:
      - app
      - admin
      - gitlab
    ports:
      - "80:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    networks:
      - railway
    restart: unless-stopped
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-app.127.0.0.1.nip.io}"
      ADMIN_DOMAIN: "${ADMIN_DOMAIN:-admin.127.0.0.1.nip.io}"
      GITLAB_DOMAIN: "${GITLAB_DOMAIN:-gitlab.127.0.0.1.nip.io}"
  
volumes:
  postgres_data:
  pgadmin_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data: